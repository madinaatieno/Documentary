<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Documentary</title>
  <style>body{margin:0;font:16px system-ui,Arial,sans-serif;color:#222}.boot-error{max-width:34rem;margin:18vh auto;padding:24px;text-align:center}.boot-error a{color:#8a6a00}</style>
</head>
<body>
  <main class="boot-error" id="bootStatus">Loading Documentary…</main>
  <script>
    (async function () {
      var source = 'https://raw.githubusercontent.com/madinaatieno/Documentary/255dc7a9082d9a0936bb6866f6b57dc64386a89f/index.html';
      try {
        var response = await fetch(source, { cache: 'no-store' });
        if (!response.ok) throw new Error('App source could not be fetched');
        var html = await response.text();
        var recoveryScript = '<script>function dismissStuckSplash(){var splash=document.getElementById("splash");if(splash)splash.style.display="none";}if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){setTimeout(dismissStuckSplash,800);},{once:true});}else{dismissStuckSplash();}window.addEventListener("load",dismissStuckSplash,{once:true});setTimeout(dismissStuckSplash,7000);<' + '/script>';
        if (/<\/body\s*>/i.test(html)) html = html.replace(/<\/body\s*>/i, recoveryScript + '</body>');
        else html += recoveryScript;
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        var status = document.getElementById('bootStatus');
        if (status) status.innerHTML = 'Documentary could not load. Check your connection and <a href="?refresh=' + Date.now() + '">try again</a>.';
      }
    })();
  </script>
  <noscript>Documentary requires JavaScript to load.</noscript>
</body>
</html>
