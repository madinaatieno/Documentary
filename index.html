<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f2">
  <title>Documentary</title>
  <style>
    html,body{height:100%;margin:0;background:#f4f4f2;color:#111;font-family:Inter,system-ui,Arial,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#666;font-size:15px}
    .boot:after{content:"";width:28px;height:28px;border:3px solid #eee;border-top-color:#ffc82e;border-radius:50%;animation:spin .8s linear infinite;position:absolute;margin-top:60px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot">Loading Documentary…</div>
  <script>
  (async function(){
    const source='https://raw.githubusercontent.com/madinaatieno/Documentary/fdd03663b3279281fc957c33876c0394072cc0e8/index.html';
    try{
      const response=await fetch(source,{cache:'no-store'});
      if(!response.ok) throw new Error('Unable to load the app');
      const markup=await response.text();
      const parsed=new DOMParser().parseFromString(markup,'text/html');
      const styles=parsed.querySelector('style');
      if(styles) document.head.appendChild(styles.cloneNode(true));
      document.title=parsed.title||'Documentary';
      document.body.innerHTML=parsed.body.innerHTML;
      Array.from(parsed.body.querySelectorAll('script')).forEach(oldScript=>{
        const script=document.createElement('script');
        if(oldScript.src) script.src=oldScript.src;
        else script.textContent=oldScript.textContent;
        document.body.appendChild(script);
      });
      const page=document.getElementById('settingsPage');
      if(!page) throw new Error('Settings page not found');
      const editCards=Array.from(page.querySelectorAll('.set-card'));
      const editProfile=document.createElement('div');
      editProfile.id='settingsEditProfile';
      editProfile.className='settings-edit-profile hidden';
      editCards.forEach(card=>editProfile.appendChild(card));
      const saveButton=page.querySelector('button[onclick="saveSettings()"]');
      const logoutButton=page.querySelector('button[onclick="doLogout()"]');
      const backLink=page.querySelector('a[href="?page=profile"]');
      const message=page.querySelector('#settingsMsg');
      if(saveButton) editProfile.appendChild(saveButton);
      if(message) editProfile.appendChild(message);
      if(backLink) backLink.remove();
      if(logoutButton) logoutButton.remove();
      page.classList.remove('pad');
      page.innerHTML='';
      page.appendChild(editProfile);
      page.insertAdjacentHTML('afterbegin',`
        <div class="settings-screen">
          <div class="settings-header">
            <a class="settings-back" href="?page=profile" aria-label="Back to profile"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></a>
            <h1>Settings</h1><span class="settings-header-spacer"></span>
          </div>
          <div class="settings-content">
            <section class="settings-section">
              <h2>Account</h2>
              <div class="settings-card">
                <button class="settings-row" type="button" onclick="openSettingsEditor()"><span class="row-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><span>Edit Profile</span><span class="row-chevron">›</span></button>
                <button class="settings-row" type="button" onclick="openPasswordSettings()"><span class="row-icon"><svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3M12 14v3"/></svg></span><span>Change Password</span><span class="row-chevron">›</span></button>
                <button class="settings-row" type="button" onclick="openPrivacySettings()"><span class="row-icon"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/></svg></span><span>Privacy</span><span class="row-chevron">›</span></button>
              </div>
            </section>
            <section class="settings-section">
              <h2>Preferences</h2>
              <div class="settings-card">
                <div class="settings-row"><span class="row-icon"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/></svg></span><span>Notifications</span><button class="settings-toggle" id="settingsNotifications" aria-label="Toggle notifications" aria-pressed="true" onclick="toggleSettingsNotifications()"><i></i></button></div>
                <button class="settings-row" type="button" onclick="changeSettingsLanguage()"><span class="row-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg></span><span>Language</span><span class="row-value" id="settingsLanguageValue">English</span></button>
                <button class="settings-row" type="button" onclick="changeSettingsTheme()"><span class="row-icon"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-1-.8-1.7-1.8-1.7H17a2 2 0 0 1-2-2c0-.5.2-1 .5-1.4.4-.5.5-1.1.5-1.7A4.2 4.2 0 0 0 12 3Z"/><circle cx="7.5" cy="10" r=".8"/><circle cx="10" cy="6.5" r=".8"/></svg></span><span>Theme</span><span class="row-value" id="settingsThemeValue">Light</span></button>
              </div>
            </section>
            <section class="settings-section">
              <h2>Support</h2>
              <div class="settings-card">
                <button class="settings-row" type="button" onclick="openSettingsHelp()"><span class="row-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.6 9a2.5 2.5 0 1 1 4.6 1.4c-.9 1.1-2.2 1.3-2.2 3.1M12 17.5v.1"/></svg></span><span>Help Center</span><span class="row-chevron">›</span></button>
                <button class="settings-row" type="button" onclick="openSettingsAbout()"><span class="row-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 11v5M12 7h.01"/></svg></span><span>About</span><button class="settings-logout" type="button" onclick="event.stopPropagation();doLogout()">Log Out <b>›</b></button></button>
              </div>
            </section>
            <p class="settings-status" id="settingsStatus" aria-live="polite"></p>
          </div>
        </div>
        <div class="settings-dialog hidden" id="settingsDialog" role="dialog" aria-modal="true"><div class="settings-dialog-card"><button class="settings-dialog-close" onclick="closeSettingsDialog()" aria-label="Close">×</button><div id="settingsDialogContent"></div></div></div>
      `);
      const style=document.createElement('style');
      style.textContent=`
        #settingsPage{background:#f4f4f2!important;min-height:100%;padding:0 0 100px!important;color:#111}
        #settingsPage .settings-screen{min-height:100%;background:#f4f4f2}
        #settingsPage .settings-header{height:78px;border-bottom:1px solid #d8d8d8;display:flex;align-items:center;padding:0 16px;background:#f4f4f2}
        #settingsPage .settings-header h1{flex:1;text-align:center;font-size:39px;line-height:1;font-weight:900;letter-spacing:-1.8px;margin:0;color:#090909}
        #settingsPage .settings-header-spacer{width:38px;flex-shrink:0}
        #settingsPage .settings-back{width:38px;height:42px;display:flex;align-items:center;color:#111;text-decoration:none}
        #settingsPage .settings-back svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
        #settingsPage .settings-content{padding:22px 24px 24px}
        #settingsPage .settings-section{margin:0 0 24px}
        #settingsPage .settings-section h2{margin:0 0 13px 4px;font-size:20px;font-weight:700;color:#444;letter-spacing:-.3px}
        #settingsPage .settings-card{background:#fff;border-radius:24px;padding:0 0;box-shadow:0 7px 18px rgba(0,0,0,.09);overflow:hidden}
        #settingsPage .settings-row{position:relative;width:100%;min-height:78px;padding:13px 19px;border:0;background:#fff;display:flex;align-items:center;gap:18px;text-align:left;color:#111;font:500 22px/1.2 Inter,system-ui,Arial,sans-serif;cursor:pointer}
        #settingsPage .settings-row+.settings-row:before{content:"";position:absolute;left:72px;right:0;top:0;height:1px;background:#e6e6e6}
        #settingsPage .row-icon{width:32px;height:34px;flex:0 0 32px;display:grid;place-items:center}
        #settingsPage .row-icon svg{width:31px;height:31px;fill:none;stroke:#111;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
        #settingsPage .row-chevron{margin-left:auto;color:#929292;font-size:38px;font-weight:300;line-height:1}
        #settingsPage .row-value{margin-left:auto;color:#858585;font-size:21px;font-weight:500;white-space:nowrap}
        #settingsPage .settings-toggle{margin-left:auto;width:58px;height:32px;padding:0;border:0;border-radius:99px;background:#c9c9c9;position:relative;cursor:pointer;flex:none}
        #settingsPage .settings-toggle i{position:absolute;width:25px;height:25px;left:4px;top:3.5px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0002;transition:transform .18s}
        #settingsPage .settings-toggle[aria-pressed="true"]{background:#f4c51d}
        #settingsPage .settings-toggle[aria-pressed="true"] i{transform:translateX(25px)}
        #settingsPage .settings-logout{margin-left:auto;padding:6px 0 6px 8px;border:0;background:transparent;color:#c84e55;font:500 21px Inter,system-ui,Arial,sans-serif;white-space:nowrap;cursor:pointer}
        #settingsPage .settings-logout b{font-size:30px;font-weight:400;vertical-align:-2px;margin-left:4px}
        #settingsPage .settings-status{text-align:center;color:#56804b;font-size:13px;min-height:18px}
        #settingsPage .settings-edit-profile{padding:16px;background:#f4f4f2}
        #settingsPage .settings-edit-profile .set-card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin-bottom:12px}
        #settingsPage .settings-edit-profile .set-card h3{font-size:15px;margin-bottom:12px}
        #settingsPage .settings-edit-profile .set-field{margin-bottom:12px}
        #settingsPage .settings-edit-profile .set-field label{font-size:12px;font-weight:700;color:#555;display:block;margin:0 0 6px;text-transform:uppercase;letter-spacing:.3px}
        #settingsPage .settings-edit-profile .set-field input,#settingsPage .settings-edit-profile .set-field textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid #eee;background:#f8f8f8;font-size:15px;color:#111;margin:0}
        #settingsPage .settings-edit-profile .settings-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
        #settingsPage .settings-edit-profile .settings-avatar{position:relative;width:84px;height:84px;flex-shrink:0}
        #settingsPage .settings-edit-profile .settings-avatar img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:3px solid #ffc82e}
        #settingsPage .settings-edit-profile .readonly-row{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border-radius:12px;background:#f2f2f2;margin-bottom:12px}
        #settingsPage .settings-edit-profile .ro-label{font-size:12px;font-weight:700;color:#555}
        #settingsPage .settings-edit-profile .ro-value{font-size:14px;color:#333}
        #settingsPage .settings-edit-profile .ro-lock{display:block;color:#999;font-size:10px;text-align:right}
        #settingsPage .settings-edit-profile .readonly-note{font-size:11px;color:#999;text-align:center}
        #settingsPage .settings-edit-profile .btn{width:100%;padding:14px;border:0;border-radius:12px;background:#ffc82e;font-weight:800;font-size:16px;color:#111}
        #settingsPage .settings-edit-profile #settingsMsg{color:#2e7d32;text-align:center;font-size:13px}
        #settingsPage .settings-dialog{position:fixed;inset:0;background:#0008;z-index:1000;display:flex;align-items:flex-end;justify-content:center}
        #settingsPage .settings-dialog.hidden{display:none!important}
        #settingsPage .settings-dialog-card{position:relative;width:100%;max-width:430px;background:#fff;border-radius:24px 24px 0 0;padding:27px 22px 34px;box-shadow:0 -8px 30px #0002}
        #settingsPage .settings-dialog-close{position:absolute;right:15px;top:10px;border:0;background:none;font-size:32px;color:#666;cursor:pointer}
        #settingsPage .settings-dialog-card h3{font-size:22px;margin:0 35px 16px 0}
        #settingsPage .settings-dialog-card p{font-size:15px;line-height:1.5;color:#555}
        #settingsPage .settings-dialog-card label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
        #settingsPage .settings-dialog-card input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;background:#f8f8f8;font-size:16px}
        #settingsPage .settings-dialog-card .dialog-action{width:100%;padding:14px;border:0;border-radius:12px;background:#ffc82e;font-size:16px;font-weight:800;margin-top:16px}
        @media(max-width:360px){#settingsPage .settings-content{padding-left:16px;padding-right:16px}#settingsPage .settings-row{font-size:19px;padding:12px 14px;gap:13px}#settingsPage .row-value{font-size:18px}#settingsPage .settings-logout{font-size:18px}#settingsPage .settings-header h1{font-size:34px}}
      `;
      document.head.appendChild(style);
      window.openSettingsEditor=function(){document.querySelector('#settingsPage .settings-screen').classList.add('hidden');document.getElementById('settingsEditProfile').classList.remove('hidden');};
      window.openSettingsPassword=function(){showSettingsDialog('<h3>Change Password</h3><p>Choose a new password for your Documentary account.</p><label for="newSettingsPassword">New password</label><input id="newSettingsPassword" type="password" minlength="6" placeholder="At least 6 characters"><label for="confirmSettingsPassword">Confirm password</label><input id="confirmSettingsPassword" type="password" minlength="6" placeholder="Repeat new password"><button class="dialog-action" onclick="saveSettingsPassword()">Update Password</button>');};
      window.openPrivacySettings=function(){showSettingsDialog('<h3>Privacy</h3><p>Your profile and documentaries are visible to other Documentary users. Account credentials and personal information are handled through your authenticated account.</p><p>You can edit your profile details from Account → Edit Profile.</p>');};
      window.openSettingsHelp=function(){showSettingsDialog('<h3>Help Center</h3><p>Need help with your account or a documentary? Contact Documentary support or check back here for help resources.</p>');};
      window.openSettingsAbout=function(){showSettingsDialog('<h3>About Documentary</h3><p>Documentary is a place to share real stories and discover documentaries about nature, history, science, culture, and more.</p>');};
      window.showSettingsDialog=function(html){document.getElementById('settingsDialogContent').innerHTML=html;document.getElementById('settingsDialog').classList.remove('hidden');};
      window.closeSettingsDialog=function(){document.getElementById('settingsDialog').classList.add('hidden');};
      window.toggleSettingsNotifications=function(){const button=document.getElementById('settingsNotifications');const enabled=button.getAttribute('aria-pressed')!=='true';button.setAttribute('aria-pressed',String(enabled));try{localStorage.setItem('documentary_notifications_enabled',String(enabled));}catch(e){}};
      window.changeSettingsLanguage=function(){const current=document.getElementById('settingsLanguageValue').textContent;const next=prompt('Language',current);if(next&&next.trim()){document.getElementById('settingsLanguageValue').textContent=next.trim();try{localStorage.setItem('documentary_language',next.trim());}catch(e){}}};
      window.changeSettingsTheme=function(){const el=document.getElementById('settingsThemeValue');const next=el.textContent==='Light'?'Dark':'Light';el.textContent=next;try{localStorage.setItem('documentary_theme',next);}catch(e){}document.querySelector('#settingsPage .settings-screen').classList.toggle('settings-dark',next==='Dark');};
      window.saveSettingsPassword=async function(){const password=document.getElementById('newSettingsPassword').value;const confirm=document.getElementById('confirmSettingsPassword').value;if(password.length<6){alert('Password must be at least 6 characters.');return;}if(password!==confirm){alert('Passwords do not match.');return;}if(!window.sbClient){alert('Authentication service is unavailable.');return;}const{error}=await window.sbClient.auth.updateUser({password});if(error){alert(error.message);return;}closeSettingsDialog();alert('Password updated successfully.');};
      window.openSettingsEditor=function(){document.querySelector('#settingsPage .settings-screen').classList.add('hidden');document.getElementById('settingsEditProfile').classList.remove('hidden');};
      const back=page.querySelector('.settings-back');back.addEventListener('click',function(e){if(!document.getElementById('settingsEditProfile').classList.contains('hidden')){e.preventDefault();document.getElementById('settingsEditProfile').classList.add('hidden');document.querySelector('#settingsPage .settings-screen').classList.remove('hidden');}});
      try{const notif=localStorage.getItem('documentary_notifications_enabled');if(notif!==null)document.getElementById('settingsNotifications').setAttribute('aria-pressed',notif);const language=localStorage.getItem('documentary_language');if(language)document.getElementById('settingsLanguageValue').textContent=language;const theme=localStorage.getItem('documentary_theme');if(theme)document.getElementById('settingsThemeValue').textContent=theme;}catch(e){}
    }catch(error){document.body.innerHTML='<main style="font:16px system-ui;padding:24px;color:#333"><h2>Documentary could not load</h2><p>Please refresh this page or try again later.</p><p style="color:#777">'+String(error.message||error)+'</p></main>';}
  })();
  </script>
</body>
</html>
