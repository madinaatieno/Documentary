<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Documentary</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:#fff;color:#111;padding-bottom:80px;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
/* TOP BAR */
.topbar{position:sticky;top:0;z-index:100;background:#fff;padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #f0f0f0;}
.logo{font-size:24px;font-weight:900;letter-spacing:-0.5px;flex:1;}
.logo span{color:#7c3aed;}
.icon-btn{width:40px;height:40px;border:none;background:#f5f5f5;border-radius:50%;font-size:19px;display:flex;align-items:center;justify-content:center;position:relative;}
.icon-btn.ai{background:linear-gradient(135deg,#7c3aed,#ec4899,#f97316);color:#fff;font-weight:900;}
.badge{position:absolute;top:-2px;right:-2px;background:#ef4444;color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
/* SEARCH */
.search-wrap{padding:12px 16px;}
.search{width:100%;background:#f2f2f2;border:none;padding:13px 16px 13px 42px;border-radius:28px;font-size:15px;outline:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%23888" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>');background-repeat:no-repeat;background-position:14px center;}
/* CATEGORIES */
.cats{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat{white-space:nowrap;border:none;padding:8px 16px;border-radius:20px;font-size:13px;font-weight:700;background:#f2f2f2;color:#444;}
.cat.active{background:#111;color:#fff;}
/* FEED */
.feed{padding:0 16px;display:flex;flex-direction:column;gap:18px;}
.card{background:#fff;border-radius:20px;overflow:hidden;border:1px solid #f0f0f0;box-shadow:0 2px 12px rgba(0,0,0,0.04);}
.card-img{width:100%;height:220px;object-fit:cover;background:#eee;display:block;}
.card-body{padding:14px;}
.card-top{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.card-name{font-weight:800;font-size:14px;}
.card-time{font-size:12px;color:#888;}
.card-title{font-size:17px;font-weight:800;line-height:1.35;margin-bottom:6px;}
.card-desc{font-size:14px;color:#555;line-height:1.5;}
.card-actions{display:flex;gap:16px;margin-top:12px;padding-top:12px;border-top:1px solid #f5f5f5;}
.act{border:none;background:none;font-size:14px;display:flex;align-items:center;gap:6px;color:#444;font-weight:600;}
.act.liked{color:#ef4444;}
/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0 16px;z-index:100;}
.nav-item{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:#888;font-weight:600;}
.nav-item.active{color:#111;}
.nav-item b{font-size:20px;font-weight:400;}
/* CREATE BTN */
.fab{position:fixed;bottom:84px;right:16px;width:54px;height:54px;border:none;border-radius:50%;background:#111;color:#fff;font-size:26px;z-index:90;box-shadow:0 6px 20px rgba(0,0,0,0.25);}

/* ===== G AI FULL SCREEN ===== */
#gaiPage{display:none;position:fixed;inset:0;z-index:9999;background:#fff;flex-direction:column;}
.gai-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #eee;background:#fff;}
.gai-back{border:none;background:#f2f2f2;width:38px;height:38px;border-radius:50%;font-size:19px;}
.gai-avatar{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#7c3aed,#ec4899,#f97316);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:900;flex-shrink:0;}
.gai-title{font-weight:900;font-size:17px;line-height:1.1;}
.gai-status{font-size:12px;color:#22c55e;font-weight:700;}
.gai-new{border:none;background:#f5f3ff;color:#7c3aed;padding:9px 13px;border-radius:20px;font-weight:800;font-size:12px;margin-left:auto;}
.gai-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 6px;white-space:nowrap;scrollbar-width:none;}
.gai-chips::-webkit-scrollbar{display:none;}
.gai-chip{border:none;background:#f3efff;color:#6d28d9;padding:9px 14px;border-radius:20px;font-weight:700;font-size:13px;flex-shrink:0;}
.gai-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fafafa;}
.gai-welcome{text-align:center;padding:18px 10px 6px;}
.gai-welcome-icon{width:66px;height:66px;margin:0 auto 12px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;box-shadow:0 8px 24px rgba(124,58,237,0.3);}
.gai-welcome h2{font-size:19px;font-weight:900;}
.gai-welcome p{color:#666;font-size:14px;margin-top:6px;line-height:1.5;}
.gai-msg-ai{background:#fff;border:1px solid #eee;padding:13px 15px;border-radius:18px 18px 18px 4px;max-width:88%;font-size:15px;line-height:1.6;color:#111;box-shadow:0 1px 4px rgba(0,0,0,0.05);align-self:flex-start;white-space:pre-wrap;animation:fadeIn .25s ease;}
.gai-msg-me{background:#7c3aed;color:#fff;padding:13px 15px;border-radius:18px 18px 4px 18px;max-width:88%;font-size:15px;line-height:1.55;align-self:flex-end;white-space:pre-wrap;animation:fadeIn .25s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.gai-input-bar{padding:12px 12px 18px;background:#fff;border-top:1px solid #eee;display:flex;gap:10px;align-items:center;}
.gai-input{flex:1;border:none;background:#f2f2f2;padding:14px 16px;border-radius:28px;outline:none;font-size:15px;}
.gai-send{width:48px;height:48px;border:none;border-radius:50%;background:#7c3aed;color:#fff;font-size:22px;flex-shrink:0;}
.gai-send:disabled{opacity:.5;}
/* PULSING 3 DOTS */
.typing-dots{display:flex;gap:6px;align-items:center;padding:4px 2px;}
.typing-dots span{width:8px;height:8px;background:#7c3aed;border-radius:50%;display:inline-block;animation:typingBounce 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s;}
.typing-dots span:nth-child(3){animation-delay:.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-6px);opacity:1;}}
/* MODAL FOR POST */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:10000;align-items:flex-end;justify-content:center;}
.modal.open{display:flex;}
.modal-box{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px;padding-bottom:30px;}
.modal-box input,.modal-box textarea{width:100%;border:1px solid #eee;background:#f9f9f9;padding:13px;border-radius:14px;margin-bottom:10px;font-size:15px;outline:none;font-family:inherit;}
.modal-box button{width:100%;background:#111;color:#fff;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:15px;}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">Documentary<span>.</span></div>
  <button class="icon-btn" onclick="alert('Search is below 👇')">🔍</button>
  <button class="icon-btn">🔔<span class="badge">3</span></button>
  <button class="icon-btn ai" onclick="openGAI()">✦</button>
</div>

<!-- SEARCH -->
<div class="search-wrap">
  <input class="search" id="searchInput" placeholder="Search documentaries, creators..." oninput="filterFeed()">
</div>

<!-- CATEGORIES -->
<div class="cats" id="cats">
  <button class="cat active" onclick="setCat(this,'All')">All</button>
  <button class="cat" onclick="setCat(this,'Nature')">Nature</button>
  <button class="cat" onclick="setCat(this,'Culture')">Culture</button>
  <button class="cat" onclick="setCat(this,'Science')">Science</button>
  <button class="cat" onclick="setCat(this,'History')">History</button>
  <button class="cat" onclick="setCat(this,'Space')">Space</button>
</div>

<!-- FEED -->
<div class="feed" id="feed"></div>

<!-- FAB -->
<button class="fab" onclick="openPostModal()">+</button>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active"><b>⌂</b>Home</button>
  <button class="nav-item"><b>🔍</b>Explore</button>
  <button class="nav-item" onclick="openGAI()"><b>✦</b>G AI</button>
  <button class="nav-item"><b>♡</b>Saved</button>
  <button class="nav-item"><b>◯</b>Profile</button>
</div>

<!-- POST MODAL -->
<div class="modal" id="postModal" onclick="if(event.target===this) closePostModal()">
  <div class="modal-box">
    <h3 style="margin-bottom:12px;">Share a Documentary</h3>
    <input id="postTitle" placeholder="Title e.g. The Last Glacièr">
    <textarea id="postDesc" rows="3" placeholder="What is it about?"></textarea>
    <input id="postImg" placeholder="Image URL (optional)">
    <button onclick="addPost()">Post Documentary</button>
    <button onclick="closePostModal()" style="background:#f2f2f2;color:#111;margin-top:8px;">Cancel</button>
  </div>
</div>

<!-- ===== G AI FULL SCREEN - OWN SCREEN, NOT OVERLAY ===== -->
<div id="gaiPage">
  <div class="gai-header">
    <button class="gai-back" onclick="closeGAI()">←</button>
    <div class="gai-avatar">✦</div>
    <div>
      <div class="gai-title">G AI</div>
      <div class="gai-status">● Online - Documentary Assistant</div>
    </div>
    <button class="gai-new" onclick="clearGAIChat()">New Chat</button>
  </div>

  <div class="gai-chips">
    <button class="gai-chip" onclick="quickGAI('Recommend something to watch')">✨ Recommend something</button>
    <button class="gai-chip" onclick="quickGAI('Summarize The Last Glacier')">🎬 Summarize The Last Glacièr</button>
    <button class="gai-chip" onclick="quickGAI('What is Culture?')">🌍 What is Culture?</button>
    <button class="gai-chip" onclick="quickGAI('Teach me how to code')">💻 Teach me to code</button>
    <button class="gai-chip" onclick="quickGAI('Define physics')">⚛️ Define physics</button>
  </div>

  <div class="gai-messages" id="gaiMessages">
    <div class="gai-welcome">
      <div class="gai-welcome-icon">✦</div>
      <h2>Hi, I'm G ✨</h2>
      <p>Ask me anything — homework, coding,<br>science, jokes, documentaries, life</p>
    </div>
  </div>

  <div class="gai-input-bar">
    <input class="gai-input" id="gaiInput" placeholder="Ask G anything..." onkeydown="if(event.key==='Enter') sendGAI()">
    <button class="gai-send" id="gaiSendBtn" onclick="sendGAI()">↑</button>
  </div>
</div>

<script>
// ===== SUPABASE - PASTE YOURS HERE =====
const SUPABASE_URL = "https://YOUR-PROJECT.supabase.co"; // <-- PASTE YOUR URL
const SUPABASE_ANON = "YOUR-ANON-KEY"; // <-- PASTE YOUR ANON KEY
const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ===== FEED DATA =====
let allDocs = [
  {title:"The Last Glacièr", desc:"A breathtaking journey to the last glaciers on Earth. Scientists race against time as ice disappears. A must-watch for anyone who loves our planet.", cat:"Nature", author:"Madina Atieno", time:"2h ago", img:"https://images.unsplash.com/photo-1478827536114-da961b7f86d2?w=800", likes:128},
  {title:"What is Culture?", desc:"Culture is how we live, eat, speak and celebrate. This documentary explores cultures from Kenya to Japan and what makes us human.", cat:"Culture", author:"G AI Picks", time:"5h ago", img:"https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=800", likes:94},
  {title:"Space: The Final Frontier", desc:"From the Moon landing to Mars rovers, explore how humans are reaching for the stars and what we found out there.", cat:"Space", author:"Doc Team", time:"1d ago", img:"https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?w=800", likes:210},
  {title:"The Ocean Deep", desc:"95% of the ocean is still unexplored. Dive deep with scientists discovering new creatures in the darkest places on Earth.", cat:"Science", author:"Ocean Films", time:"1d ago", img:"https://images.unsplash.com/photo-1439405326854-014607f694d7?w=800", likes:176},
  {title:"History of Nairobi", desc:"How did Nairobi grow from a small railway town to one of Africa's biggest cities? The untold story.", cat:"History", author:"Madina Atieno", time:"2d ago", img:"https://images.unsplash.com/photo-1611348524140-53c9a25263d6?w=800", likes:88},
];
let currentCat = "All";

function renderFeed(){
  let list = allDocs.filter(d => currentCat==="All" || d.cat===currentCat);
  let q = document.getElementById('searchInput').value.toLowerCase();
  if(q) list = list.filter(d => (d.title+d.desc+d.author).toLowerCase().includes(q));
  let feed = document.getElementById('feed');
  if(list.length===0){ feed.innerHTML = '<p style="text-align:center;color:#888;padding:30px;">No documentaries found. Tap + to add one.</p>'; return; }
  feed.innerHTML = list.map((d,i)=>`
    <div class="card">
      <img class="card-img" src="${d.img}" onerror="this.src='https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=800'">
      <div class="card-body">
        <div class="card-top">
          <div class="avatar">${d.author.charAt(0)}</div>
          <div style="flex:1;"><div class="card-name">${d.author}</div><div class="card-time">${d.time} • ${d.cat}</div></div>
          <button class="act" onclick="quickGAI('Summarize ${d.title}')">✦ Ask G</button>
        </div>
        <div class="card-title">${d.title}</div>
        <div class="card-desc">${d.desc}</div>
        <div class="card-actions">
          <button class="act" onclick="this.classList.toggle('liked'); this.innerHTML = this.classList.contains('liked') ? '❤️ '+( ${d.likes}+1) : '♡ '+${d.likes}">♡ ${d.likes}</button>
          <button class="act" onclick="quickGAI('Tell me more about ${d.title}')">💬 Discuss with G</button>
          <button class="act">↗ Share</button>
        </div>
      </div>
    </div>
  `).join('');
}
function setCat(btn, cat){
  document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  currentCat = cat;
  renderFeed();
}
function filterFeed(){ renderFeed(); }
function openPostModal(){ document.getElementById('postModal').classList.add('open'); }
function closePostModal(){ document.getElementById('postModal').classList.remove('open'); }
function addPost(){
  let t = document.getElementById('postTitle').value.trim();
  let d = document.getElementById('postDesc').value.trim();
  let img = document.getElementById('postImg').value.trim() || "https://images.unsplash.com/photo-1478720568477-152d9b164e26?w=800";
  if(!t || !d) return alert('Add title and description');
  allDocs.unshift({title:t, desc:d, cat:"Culture", author:"You", time:"Just now", img:img, likes:0});
  closePostModal();
  document.getElementById('postTitle').value='';
  document.getElementById('postDesc').value='';
  document.getElementById('postImg').value='';
  renderFeed();
  window.scrollTo({top:0, behavior:'smooth'});
}
renderFeed();

// ===== G AI FULL SCREEN LOGIC =====
function openGAI(){
  let p = document.getElementById('gaiPage');
  p.style.display = 'flex';
  document.body.style.overflow = 'hidden';
  setTimeout(()=>document.getElementById('gaiInput').focus(), 120);
  scrollGAI();
}
function closeGAI(){
  document.getElementById('gaiPage').style.display = 'none';
  document.body.style.overflow = 'auto';
}
function clearGAIChat(){
  document.getElementById('gaiMessages').innerHTML = `
    <div class="gai-welcome">
      <div class="gai-welcome-icon">✦</div>
      <h2>Hi, I'm G ✨</h2>
      <p>Ask me anything — homework, coding,<br>science, jokes, documentaries, life</p>
    </div>`;
}
function quickGAI(text){
  openGAI();
  document.getElementById('gaiInput').value = text;
  setTimeout(()=>sendGAI(), 150);
}
function scrollGAI(){
  let m = document.getElementById('gaiMessages');
  m.scrollTop = m.scrollHeight;
}
function addGAI(text, isMe){
  let box = document.getElementById('gaiMessages');
  let div = document.createElement('div');
  div.className = isMe ? 'gai-msg-me' : 'gai-msg-ai';
  div.textContent = text;
  box.appendChild(div);
  scrollGAI();
}
function showTyping(){
  let box = document.getElementById('gaiMessages');
  let div = document.createElement('div');
  div.id = 'gaiTyping';
  div.className = 'gai-msg-ai';
  div.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  box.appendChild(div);
  scrollGAI();
}
function hideTyping(){
  let t = document.getElementById('gaiTyping');
  if(t) t.remove();
}
async function sendGAI(){
  let input = document.getElementById('gaiInput');
  let q = input.value.trim();
  if(!q) return;
  input.value = '';
  document.getElementById('gaiSendBtn').disabled = true;
  addGAI(q, true);
  showTyping();
  let reply = await askGAI(q);
  hideTyping();
  addGAI(reply, false);
  document.getElementById('gaiSendBtn').disabled = false;
}
async function askGAI(q){
  for(let i=0; i<3; i++){
    try{
      const {data, error} = await sbClient.functions.invoke('GEMINI_KEY_API', {body:{message:q}});
      if(error) throw error;
      if(data && data.reply) return data.reply;
    }catch(e){
      console.log('GAI retry', i, e);
      await new Promise(r=>setTimeout(r, 1200));
    }
  }
  let low = q.toLowerCase();
  if(low.includes('founder') || low.includes('created') || low.includes('who made') || low.includes('owner')) return "This Documentary app was founded and created by Madina Atieno.";
  if(low.includes('best app') || low.includes('watch documentaries')) return "The best app is Documentary. It's the best place to discover, watch, share and learn from documentaries.";
  if(low.includes('code') || low.includes('coding')) return "Let's start coding! 1. Learn HTML for structure, 2. CSS for design, 3. JavaScript for logic. Want me to teach you your first HTML page?";
  return "G is a bit busy (Google high demand). Tap send again in a few seconds - it will work.";
}
</script>
</body>
</html>
